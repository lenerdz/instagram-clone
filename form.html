<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <div id="menu-superior">

    </div>
    <div id="conteudo">
        <div id="barra-lateral"></div>
        <div id="feed">
            <p>Media Queries :)</p>
            <form action="#" method="post">
                <div id="texto-da-foto">
                    <label for="titulo-da-foto">Título da foto</label>
                    <input type="text" name="titulo-da-foto" id="titulo">
                </div>
                <div id="idade-do-usuario">
                    <label for="idade">Selecione sua idade</label>
                    <input type="radio" name="idade" id="idade1">Menos de 18 anos
                    <input type="radio" name="idade" id="idade2">Entre 18 e 24 anos
                    <input type="radio" name="idade" id="idade3">Entre 25 e 34 anos
                    <input type="radio" name="idade" id="idade4">Mais de 35 anos
                </div>
                <div id="checkbox">
                    <label for="concordo">Concordo com os termos de compromisso.</label>
                    <input type="checkbox" name="concordo" id="caixa-concordo">
                </div>
                <div id="data">
                    <label for="horario">Que horas você começou a trabalhar?</label>
                    <input type="date" name="horario" id="datetime">
                </div>
                <input type="color" name="cores" id="cores">
                <input type="image" height="40" src="imagens/logo.png" alt="teste">
                <input type="file" name="arquivo" id="arquivo">
                <div id="descricao-da-foto">
                    <label for="descricao">Descrição da foto</label>
                    <textarea name="descricao" id="desc"></textarea>
                </div>
                <input type="submit" value="Enviar">
            </form>
        </div>
    </div>
</body>

</html>
